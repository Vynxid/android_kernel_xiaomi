name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Give permission to build.sh
        run: chmod +x dynamic/build.sh

      - name: Run build.sh
        run: ./build.sh

      - name: Upload zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip
          path: ./*.zip
          
